<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>布局改版 · 三项方案原型</title>
<style>
  :root {
    --bg:#0b0e14; --bg-elev:#12161f; --bg-card:#171c28; --bg-card-2:#1d2331;
    --line:rgba(255,255,255,.08); --text:#e8ebf1; --text-2:#9aa3b2; --text-3:#7d8590;
    --accent:#3b82f6; --accent-soft:rgba(59,130,246,.16); --green:#34c759; --orange:#ff9f0a; --red:#ff453a; --purple:#bf5af2;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
    --ease-out:cubic-bezier(0.23,1,0.32,1); --ease-drawer:cubic-bezier(0.32,0.72,0,1);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:#05070b; color:var(--text); font-family:var(--font); min-height:100vh; }
  .page-head { text-align:center; padding:30px 20px 6px; }
  .page-head h1 { font-size:20px; }
  .page-head p { color:var(--text-2); font-size:12.5px; margin-top:6px; }
  .switcher { display:none; }
  .stage { display:flex; gap:26px; justify-content:center; align-items:flex-start; padding:22px 16px 70px; flex-wrap:wrap; }
  .option { width:393px; max-width:100%; }
  .option-note { margin:12px 4px 0; font-size:12.5px; color:var(--text-2); line-height:1.7; }
  .phone { background:var(--bg); border-radius:40px; border:10px solid #1c1f26; box-shadow:0 0 0 2px #33373f,0 24px 60px rgba(0,0,0,.6); overflow:hidden; height:660px; display:flex; flex-direction:column; position:relative; }
  .phone .safe { height:env(safe-area-inset-top,0px); flex:none; }

  /* navbar */
  .navbar { flex:none; padding:10px 10px 10px; display:flex; align-items:center; gap:6px; border-bottom:.5px solid var(--line); }
  .big-title { font-size:22px; font-weight:700; flex:1; }
  .nav-btn { min-width:38px; height:38px; border:none; background:none; color:var(--accent); border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:20px; }
  .title-block { flex:1; min-width:0; }
  .t-title { font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .t-sub { font-size:11px; color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .t-sub.running { color:#6aa6ff; display:flex; align-items:center; gap:5px; }
  .run-dot { width:6px; height:6px; border-radius:50%; background:#6aa6ff; animation:pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity:.25 } }
  .stop-btn { width:34px; height:34px; border-radius:50%; border:1px solid rgba(255,69,58,.5); background:rgba(255,69,58,.12); color:var(--red); display:flex; align-items:center; justify-content:center; }
  .stop-btn:active { transform:scale(.9); }
  .stop-btn svg { width:12px; height:12px; }

  /* 列表 */
  .scroll { flex:1; overflow-y:auto; padding:8px 0; display:flex; flex-direction:column; }
  .search-row { display:flex; gap:8px; padding:6px 16px 10px; }
  .search { flex:1; height:38px; border:none; outline:none; border-radius:12px; background:var(--bg-card); color:var(--text); font-size:16px; padding:0 14px; }
  .todo-chip { flex:none; display:flex; align-items:center; gap:6px; height:38px; padding:0 13px; border-radius:12px; background:rgba(255,159,10,.13); border:1px solid rgba(255,159,10,.35); color:var(--orange); font-size:13px; font-weight:700; }
  .todo-chip .n { background:var(--orange); color:#000; border-radius:9px; font-size:11px; min-width:17px; height:17px; display:flex; align-items:center; justify-content:center; }
  .card { margin:0 12px 10px; padding:13px 15px; background:var(--bg-card); border:.5px solid var(--line); border-radius:17px; display:flex; flex-direction:column; gap:6px; }
  .card .r1 { display:flex; align-items:center; gap:8px; }
  .card .st { font-size:15.5px; font-weight:600; flex:1; }
  .card .tm { font-size:11.5px; color:var(--text-3); }
  .card .pv { font-size:13px; color:var(--text-2); line-height:1.4; }
  .badge { font-size:11px; font-weight:700; padding:2px 8px; border-radius:14px; display:inline-flex; align-items:center; gap:4px; width:fit-content; }
  .badge.ap { background:rgba(255,159,10,.14); color:var(--orange); }
  .badge.run { background:var(--accent-soft); color:#6aa6ff; }
  .badge.idle { background:rgba(255,255,255,.06); color:var(--text-3); }
  /* FAB */
  .fab { position:absolute; right:18px; bottom:22px; width:56px; height:56px; border-radius:18px; border:none; background:var(--accent); color:#fff; box-shadow:0 10px 28px rgba(59,130,246,.4); display:flex; align-items:center; justify-content:center; }
  .fab:active { transform:scale(.92); }
  .fab svg { width:24px; height:24px; }

  /* 对话 */
  .chat { flex:1; overflow-y:auto; padding:14px 12px; display:flex; flex-direction:column; gap:14px; }
  .msg { display:flex; flex-direction:column; gap:4px; }
  .msg.user { align-items:flex-end; }
  .msg.bot { align-items:flex-start; }
  .bubble { padding:10px 14px; border-radius:19px; font-size:14.5px; line-height:1.55; max-width:85%; }
  .msg.user .bubble { background:var(--accent); color:#fff; border-bottom-right-radius:6px; }
  .msg.bot .bubble { background:var(--bg-card); border:.5px solid var(--line); border-bottom-left-radius:6px; }
  /* ★ meta 行：时间 + 复制 + 思考，一排小图标 */
  .meta-row { display:flex; align-items:center; gap:2px; padding:0 4px; }
  .msg.user .meta-row { flex-direction:row-reverse; }
  .meta-time { font-size:11px; color:var(--text-3); font-variant-numeric:tabular-nums; margin-right:6px; }
  .msg.user .meta-time { margin-right:0; margin-left:6px; }
  .meta-ico { width:30px; height:30px; border-radius:9px; border:none; background:none; color:var(--text-3); display:flex; align-items:center; justify-content:center; }
  .meta-ico:active { background:var(--bg-card-2); transform:scale(.88); }
  .meta-ico svg { width:14px; height:14px; }
  .meta-ico.think { color:var(--text-3); }
  .meta-ico.think.live { color:var(--purple); }
  .meta-ico.think.live .td { animation:ty-wave 1.1s ease-in-out infinite; }
  .meta-ico.think.live .td:nth-child(2) { animation-delay:.15s }
  .meta-ico.think.live .td:nth-child(3) { animation-delay:.3s }
  @keyframes ty-wave { 0%,100% { transform:translateY(0); opacity:.5 } 50% { transform:translateY(-2.2px); opacity:1 } }
  /* composer（无运行条） */
  .composer-wrap { flex:none; padding:8px 12px 16px; border-top:.5px solid var(--line); background:rgba(18,22,31,.94); }
  .composer { display:flex; align-items:flex-end; gap:8px; }
  .input-box { flex:1; min-height:38px; max-height:110px; background:var(--bg-card); border:.5px solid var(--line); border-radius:19px; padding:9px 14px; font-size:16px; color:var(--text-3); }
  .send { width:38px; height:38px; border-radius:50%; border:none; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; }
  .send svg { width:17px; height:17px; }
  .c-btn { width:38px; height:38px; border-radius:50%; border:none; background:var(--bg-card-2); color:var(--text-2); display:flex; align-items:center; justify-content:center; }
  .c-btn svg { width:18px; height:18px; }
  /* 思考抽屉 */
  .ov { position:absolute; inset:0; background:rgba(0,0,0,.45); opacity:0; pointer-events:none; transition:opacity .22s; z-index:40; }
  .ov.open { opacity:1; pointer-events:auto; }
  .drawer { position:absolute; left:0; right:0; bottom:0; z-index:41; max-height:70%; background:var(--bg-elev); border-radius:18px 18px 0 0; transform:translateY(103%); transition:transform .3s var(--ease-drawer); display:flex; flex-direction:column; }
  .drawer.open { transform:none; }
  .drawer .grab { width:36px; height:5px; border-radius:3px; background:var(--text-3); opacity:.55; margin:8px auto 2px; }
  .drawer .dh { display:flex; align-items:center; gap:8px; padding:2px 16px 10px; }
  .drawer .dt { font-size:13px; font-weight:700; color:var(--text-2); }
  .drawer .dl { font-size:11px; font-weight:600; color:var(--purple); background:rgba(191,90,242,.14); border-radius:10px; padding:2px 8px; }
  .drawer .db { overflow-y:auto; padding:0 16px 20px; font-size:12.5px; line-height:1.75; color:var(--text-2); font-family:var(--mono); white-space:pre-wrap; }
  .toast2 { position:absolute; left:50%; bottom:100px; transform:translateX(-50%); background:rgba(30,35,46,.97); border-radius:12px; padding:9px 16px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:60; }
  .toast2.show { opacity:1; }

  @media (max-width:900px) {
    body { background:var(--bg); }
    .page-head { display:none; }
    .switcher { display:flex; gap:8px; padding:12px 14px 0; }
    .switcher button { flex:1; padding:10px 0; border-radius:11px; border:1px solid var(--line); background:var(--bg-card); color:var(--text-2); font-size:13px; font-weight:600; }
    .switcher button.on { border-color:var(--accent); color:#6aa6ff; background:var(--accent-soft); }
    .stage { padding:10px 0 40px; display:block; }
    .option { width:100%; }
    .option-note { display:none; }
    .phone { border:none; border-radius:0; box-shadow:none; height:auto; min-height:80vh; }
    .option:not(.on) { display:none; }
  }
</style>
</head>
<body>
<div class="page-head"><h1>布局改版 · 原型</h1><p>①去底栏（FAB+待办chip）②运行状态上移标题栏 ③时间/复制/思考合并 meta 行</p></div>
<div class="switcher" id="switcher">
  <button data-o="L" class="on">列表页</button>
  <button data-o="C">对话页</button>
</div>
<div class="stage" id="stage"></div>

<script>
const IC = {
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  bolt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>',
  stop:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  think:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.6 0-3.1-.4-4.3-1.1L3 20l1.2-5.2A8.5 8.5 0 1 1 21 11.5z"/><circle class="td" cx="8.6" cy="11.5" r="1.1" fill="currentColor" stroke="none"/><circle class="td" cx="12.4" cy="11.5" r="1.1" fill="currentColor" stroke="none"/><circle class="td" cx="16.2" cy="11.5" r="1.1" fill="currentColor" stroke="none"/></svg>',
  send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
  more:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg>',
}
const vib = () => { try { navigator.vibrate && navigator.vibrate(8) } catch(e){} }
function toastIn(phone, text) {
  let t = phone.querySelector('.toast2')
  t.textContent = text; t.classList.add('show')
  clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove('show'), 1600)
}
const THINK_TEXT = '用户要周报覆盖哪个时间范围？\n先看脚本的参数设计……当前只有 --date。\n如果加 --range week，要动 CLI 解析和查询两端。\n或者用自然语言解析？过度设计了。\n结论：加 --range，默认本周，向后兼容。'

/* ============ 列表页 ============ */
function buildList() {
  const d = document.createElement('div'); d.className = 'option on'; d.dataset.o = 'L'
  d.innerHTML = `
  <div class="phone"><div class="safe"></div>
    <div class="navbar"><div class="big-title">会话</div>
      <button class="nav-btn" style="color:var(--text-2)">${IC.bolt.replace('<svg','<svg width=20 height=20')}</button>
      <span style="font-size:11px;color:var(--text-2);background:var(--bg-card);border:.5px solid var(--line);padding:4px 10px;border-radius:20px">已连接</span>
    </div>
    <div class="scroll">
      <div class="search-row">
        <input class="search" placeholder="搜索会话">
        <button class="todo-chip">${IC.bolt.replace('<svg','<svg width=13 height=13')}<span>待办</span><span class="n">2</span></button>
      </div>
      <div class="card"><div class="r1"><span class="st">修复登录重定向循环</span><span class="tm">刚刚</span></div>
        <div class="pv">需要你确认：即将执行 git push origin main…</div>
        <span class="badge ap">● 等待审批</span></div>
      <div class="card"><div class="r1"><span class="st">给打卡工具加周视图</span><span class="tm">12 分钟前</span></div>
        <div class="pv">正在重构 renderWeek()…</div>
        <span class="badge run">● 运行中</span></div>
      <div class="card"><div class="r1"><span class="st">学习记录导出走查</span><span class="tm">1 小时前</span></div>
        <span class="badge idle">空闲</span></div>
      <div class="card"><div class="r1"><span class="st">周报自动生成脚本</span><span class="tm">昨天</span></div>
        <span class="badge idle">空闲</span></div>
    </div>
    <button class="fab" aria-label="新会话">${IC.plus}</button>
    <div class="toast2"></div>
  </div>
  <div class="option-note">底栏删除。「新会话」= 右下 FAB；「待办」= 搜索旁过滤 chip（仅在有待办时出现，点按进入待办过滤）。卡片上的状态徽标不变。</div>`
  d.querySelector('.fab').onclick = () => { vib(); toastIn(d.querySelector('.phone'), '新会话（原型）') }
  d.querySelector('.todo-chip').onclick = function(){ vib(); this.classList.toggle('act'); toastIn(d.querySelector('.phone'), '待办过滤 开/关（原型）') }
  return d
}

/* ============ 对话页 ============ */
function buildChat() {
  const d = document.createElement('div'); d.className = 'option'; d.dataset.o = 'C'
  d.innerHTML = `
  <div class="phone"><div class="safe"></div>
    <div class="navbar">
      <button class="nav-btn">‹</button>
      <div class="title-block">
        <div class="t-title">给打卡工具加周视图</div>
        <div class="t-sub running" id="runsub"><span class="run-dot"></span><span id="runtext">正在工作中</span></div>
      </div>
      <button class="stop-btn" id="stopbtn" aria-label="停止">${IC.stop}</button>
      <button class="nav-btn">${IC.more.replace('<svg','<svg width=20 height=20')}</button>
    </div>
    <div class="chat" id="chat">
      <div class="msg user"><div class="bubble">给 小习惯打卡 加一个周视图</div>
        <div class="meta-row"><span class="meta-time">14:02</span><button class="meta-ico" aria-label="复制">${IC.copy}</button></div></div>
      <div class="msg bot"><div class="bubble">好的，骨架已经加好，接下来接「点击某天看记录」。</div>
        <div class="meta-row"><span class="meta-time">14:03</span><button class="meta-ico" aria-label="复制">${IC.copy}</button><button class="meta-ico think live" aria-label="思考中">${IC.think}</button></div></div>
      <div class="msg bot" id="live-msg"><div class="bubble" id="live-b">正在思考…<span style="display:inline-block;width:8px;height:15px;background:var(--accent);border-radius:2px;vertical-align:-2px;margin-left:2px"></span></div>
        <div class="meta-row"><span class="meta-time">14:05</span><button class="meta-ico" aria-label="复制">${IC.copy}</button><button class="meta-ico think live" id="livedot" aria-label="思考中">${IC.think}</button></div></div>
    </div>
    <div class="composer-wrap"><div class="composer">
      <button class="c-btn">${IC.plus.replace('<svg','<svg width=18 height=18')}</button>
      <div class="input-box">追加指令（steer）…</div>
      <button class="send">${IC.send}</button>
    </div></div>
    <div class="ov" id="ov"></div>
    <div class="drawer" id="drawer"><div class="grab"></div>
      <div class="dh"><span class="dt">思考过程</span><span class="dl">● 正在思考</span></div>
      <div class="db" id="db">${THINK_TEXT}</div></div>
    <div class="toast2"></div>
  </div>
  <div class="option-note">运行条移除；状态在标题栏：副标题「● 正在工作中」+ ⏹ 停止钮（仅运行时）。每条消息下：时间 · 复制 · 思考 一排 meta 图标（助手=左对齐，用户=右对齐；思考点直播时为紫色波浪）。</div>`
  const phone = d.querySelector('.phone')
  // 复制按钮
  d.querySelectorAll('.meta-ico:not(.think)').forEach((b) => b.onclick = () => { vib(); toastIn(phone, '已复制 ✓') })
  // 思考点 → 抽屉
  const openDr = () => { phone.querySelector('#ov').classList.add('open'); phone.querySelector('#drawer').classList.add('open') }
  const closeDr = () => { phone.querySelector('#ov').classList.remove('open'); phone.querySelector('#drawer').classList.remove('open') }
  d.querySelectorAll('.meta-ico.think').forEach((b) => b.onclick = () => { vib(); openDr() })
  phone.querySelector('#ov').onclick = closeDr
  // 停止按钮：停掉"运行中"
  phone.querySelector('#stopbtn').onclick = function () {
    vib()
    const sub = phone.querySelector('#runsub')
    sub.classList.remove('running'); sub.textContent = '~/Documents/个人小工具'
    this.style.display = 'none'
    const ld = phone.querySelector('#livedot'); ld.classList.remove('live')
    phone.querySelector('#live-b').innerHTML = '已停止 ⏹'
    toastIn(phone, '已发送停止 ■')
  }
  return d
}

const stage = document.getElementById('stage')
stage.appendChild(buildList())
stage.appendChild(buildChat())
document.getElementById('switcher').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return
  document.querySelectorAll('.switcher button').forEach((x) => x.classList.toggle('on', x === b))
  document.querySelectorAll('.option').forEach((x) => x.classList.toggle('on', x.dataset.o === b.dataset.o))
})
</script>
</body>
</html>
