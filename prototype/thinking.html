<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>思考过程 · 交互方案原型</title>
<style>
  :root {
    --bg:#0b0e14; --bg-elev:#12161f; --bg-card:#171c28; --bg-card-2:#1d2331;
    --line:rgba(255,255,255,.08); --text:#e8ebf1; --text-2:#9aa3b2; --text-3:#7d8590;
    --accent:#3b82f6; --accent-soft:rgba(59,130,246,.16); --purple:#bf5af2;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
    --ease-out:cubic-bezier(0.23,1,0.32,1); --ease-drawer:cubic-bezier(0.32,0.72,0,1);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:#05070b; color:var(--text); font-family:var(--font); min-height:100vh; }
  .page-head { text-align:center; padding:34px 20px 10px; }
  .page-head h1 { font-size:22px; font-weight:700; }
  .page-head p { color:var(--text-2); font-size:13.5px; margin-top:8px; line-height:1.6; }
  .switcher { display:none; }

  .stage { display:flex; gap:26px; justify-content:center; align-items:flex-start; padding:24px 16px 60px; flex-wrap:wrap; }
  .option { width:393px; max-width:100%; }
  .option-head { display:flex; align-items:baseline; gap:10px; margin:0 4px 12px; }
  .option-head .tag { font-size:12px; font-weight:800; color:#000; background:#8ec5ff; border-radius:6px; padding:2px 8px; }
  .option-head h2 { font-size:16px; font-weight:700; }
  .option-note { margin:12px 4px 0; font-size:12.5px; color:var(--text-2); line-height:1.7; }
  .option-note b { color:var(--text); }

  .phone { background:var(--bg); border-radius:40px; border:10px solid #1c1f26; box-shadow:0 0 0 2px #33373f, 0 24px 60px rgba(0,0,0,.6); overflow:hidden; height:640px; display:flex; flex-direction:column; position:relative; }
  .p-nav { flex:none; padding:14px 14px 10px; border-bottom:.5px solid var(--line); font-size:15px; font-weight:600; display:flex; align-items:center; gap:8px; }
  .p-nav .sub { font-size:11px; color:var(--text-3); font-weight:400; }
  .p-chat { flex:1; overflow-y:auto; padding:14px 12px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:85%; display:flex; flex-direction:column; gap:5px; }
  .msg.user { align-self:flex-end; }
  .msg.bot { align-self:flex-start; min-width:0; }
  .bubble { padding:10px 14px; border-radius:19px; font-size:14.5px; line-height:1.55; word-break:break-word; }
  .msg.user .bubble { background:var(--accent); color:#fff; border-bottom-right-radius:6px; }
  .msg.bot .bubble { background:var(--bg-card); border:.5px solid var(--line); border-bottom-left-radius:6px; }
  .replay { flex:none; margin:10px 12px 14px; padding:12px 0; border:none; border-radius:13px; background:var(--bg-card-2); color:var(--text-2); font-size:13.5px; font-weight:600; }
  .replay:active { transform:scale(.97); }
  .hint { text-align:center; font-size:11px; color:var(--text-3); padding:0 0 8px; }

  /* ============ 方案 A：内联呼吸条 ============ */
  .tk-bar {
    align-self:stretch; display:flex; align-items:center; gap:8px;
    padding:9px 13px; border-radius:13px; cursor:pointer;
    background:var(--bg-card); border:.5px solid var(--line);
    transition:background-color .15s ease;
  }
  .tk-bar:active { background:var(--bg-card-2); }
  .tk-bar .tk-ico { font-size:14px; }
  .tk-bar .tk-label { font-size:13px; color:var(--text-2); font-weight:600; flex:1; }
  .tk-bar .tk-sec { font-size:11.5px; color:var(--text-3); font-variant-numeric:tabular-nums; }
  .tk-bar .tk-chev { color:var(--text-3); font-size:10px; transition:transform .25s var(--ease-out); }
  .tk-bar.live .tk-label {
    background:linear-gradient(90deg, var(--text-2) 25%, #fff 50%, var(--text-2) 75%);
    background-size:200% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:tk-shimmer 1.4s linear infinite;
  }
  @keyframes tk-shimmer { from { background-position:180% 0; } to { background-position:-20% 0; } }
  .tk-panel { overflow:hidden; max-height:0; transition:max-height .32s var(--ease-drawer); }
  .tk-panel .tk-body {
    margin-top:6px; padding:10px 13px; border-radius:13px; background:var(--bg-elev); border:.5px solid var(--line);
    font-size:12.5px; line-height:1.7; color:var(--text-2); font-family:var(--mono);
    max-height:220px; overflow-y:auto; white-space:pre-wrap; word-break:break-word;
  }
  .tk-wrap.open .tk-panel { max-height:240px; }
  .tk-wrap.open .tk-chev { transform:rotate(90deg); }
  .tk-wrap.done .tk-bar { background:transparent; border-color:transparent; padding:4px 13px; }
  .tk-wrap.done .tk-bar .tk-label { color:var(--text-3); font-weight:500; font-size:12.5px; }

  /* ============ 方案 B：浮点 + 底部抽屉 ============ */
  .tk-orb {
    position:absolute; right:14px; bottom:66px; z-index:8;
    display:flex; align-items:center; gap:7px;
    background:var(--bg-card-2); border:1px solid rgba(191,90,242,.4); border-radius:20px;
    padding:8px 14px; font-size:12.5px; font-weight:600; color:var(--purple);
    box-shadow:0 8px 24px rgba(0,0,0,.4); cursor:pointer;
    transition:transform .16s var(--ease-out), opacity .3s;
  }
  .tk-orb:active { transform:scale(.94); }
  .tk-orb .orb-dot { width:8px; height:8px; border-radius:50%; background:var(--purple); animation:orb-pulse 1.1s ease-in-out infinite; }
  .tk-orb.done { color:var(--text-3); border-color:var(--line); }
  .tk-orb.done .orb-dot { animation:none; background:var(--text-3); }
  @keyframes orb-pulse { 0%,100% { transform:scale(1); opacity:1; } 50% { transform:scale(1.5); opacity:.4; } }
  .tk-sheet-overlay { position:absolute; inset:0; background:rgba(0,0,0,.45); opacity:0; pointer-events:none; transition:opacity .2s; z-index:9; }
  .tk-sheet-overlay.open { opacity:1; pointer-events:auto; }
  .tk-sheet {
    position:absolute; left:0; right:0; bottom:0; z-index:10; max-height:72%;
    background:var(--bg-elev); border-radius:18px 18px 0 0; border-top:.5px solid var(--line);
    transform:translateY(103%); transition:transform .3s var(--ease-drawer);
    display:flex; flex-direction:column;
  }
  .tk-sheet.open { transform:none; }
  .tk-sheet .grab { width:36px; height:5px; border-radius:3px; background:var(--text-3); opacity:.55; margin:8px auto; flex:none; }
  .tk-sheet .tk-sh-title { padding:0 16px 8px; font-size:13px; font-weight:700; color:var(--text-2); flex:none; }
  .tk-sheet .tk-sh-body { overflow-y:auto; padding:0 16px 22px; font-size:12.5px; line-height:1.75; color:var(--text-2); font-family:var(--mono); white-space:pre-wrap; word-break:break-word; }

  /* ============ 方案 C：气泡窥视 ============ */
  .peek {
    align-self:stretch; max-width:92%; cursor:pointer;
    border-radius:13px; overflow:hidden;
  }
  .peek-line {
    display:flex; align-items:center; gap:8px; padding:8px 13px;
    background:var(--bg-card); border:.5px solid var(--line); border-radius:13px;
  }
  .peek-line .tk-ico { font-size:13px; flex:none; }
  .peek-line .peek-text {
    flex:1; min-width:0; font-size:12.5px; color:var(--text-3); font-family:var(--mono);
    overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
    -webkit-mask-image:linear-gradient(90deg,#000 60%,transparent); mask-image:linear-gradient(90deg,#000 60%,transparent);
  }
  .peek-line .peek-dots { color:var(--text-3); letter-spacing:2px; animation:peek-blink 1.2s infinite; font-size:12px; }
  @keyframes peek-blink { 50% { opacity:.2; } }
  .peek-body {
    max-height:0; overflow:hidden; transition:max-height .32s var(--ease-drawer);
  }
  .peek-body .inner {
    margin-top:5px; padding:10px 13px; background:var(--bg-elev); border:.5px solid var(--line); border-radius:13px;
    font-size:12.5px; line-height:1.7; color:var(--text-2); font-family:var(--mono);
    max-height:230px; overflow-y:auto; white-space:pre-wrap; word-break:break-word;
  }
  .peek.open .peek-body { max-height:250px; }
  .peek.done .peek-line { padding:6px 13px; }
  .peek.done .peek-text { font-size:12px; }

  @media (max-width: 900px) {
    body { background:var(--bg); }
    .page-head { display:none; }
    .switcher { display:flex; gap:8px; padding:12px 14px 0; }
    .switcher button { flex:1; padding:10px 0; border-radius:11px; border:1px solid var(--line); background:var(--bg-card); color:var(--text-2); font-size:13px; font-weight:600; }
    .switcher button.on { border-color:var(--accent); color:#6aa6ff; background:var(--accent-soft); }
    .stage { padding:10px 0 40px; display:block; }
    .option { width:100%; }
    .option-head, .option-note { display:none; }
    .phone { border:none; border-radius:0; box-shadow:none; height:auto; min-height:78vh; }
    .option:not(.on) { display:none; }
  }
</style>
</head>
<body>
<div class="page-head">
  <h1>「思考过程」交互方案</h1>
  <p>三个方案都是真交互：点「▶ 重放」模拟一次思考 + 回答，思考中/完成后都可以点按展开或收起。选好后告诉我编号。</p>
</div>
<div class="switcher" id="switcher">
  <button data-o="A" class="on">A · 呼吸条</button>
  <button data-o="B">B · 浮点抽屉</button>
  <button data-o="C">C · 气泡窥视</button>
</div>

<div class="stage" id="stage"></div>

<script>
const SAMPLE_REASONING = `先确认问题：用户说登录后又被跳回登录页。
看一下回调 URL 的拼接逻辑……
注意到 redirect_uri 末尾多了个 /，而服务端做的是严格相等匹配。
所以鉴权成功后回跳的地址和注册的地址不一致，被中间件当成未登录，又打回登录页——循环就这么来的。
修法有两个：
1. 拼接时去掉末尾斜杠（治标，改一处）
2. 服务端匹配改成规范化后比较（治本，但要动公共中间件）
先用方案 1，影响面最小；同时在回调入口加一条日志，方便以后排查。`;

const ANSWER = '问题定位了：回调地址末尾的 `/` 导致鉴权后被误判未登录。已修复并加了日志，你再试一下。';

function phoneBase(inner, extra) {
  return `<div class="p-nav">修复登录重定向循环 <span class="sub">运行中…</span></div>
    <div class="p-chat">
      <div class="msg user"><div class="bubble">登录成功后又被踢回登录页，查一下</div></div>
      ${inner}
    </div>
    <div class="hint">点按紫色/灰色区域试试</div>
    <button class="replay">▶ 重放思考过程</button>
    ${extra || ''}`
}

/* 三个方案的 DOM 工厂 + 行为 */
const OPTIONS = {
  A: {
    title: '内联呼吸条',
    note: '<b>位置：</b>消息流里一条薄条，思考时文字扫光。<b>展开：</b>原地手风琴。<b>优点：</b>不离流、状态最强；<b>缺点：</b>占一行高度，长思考历史里每条都在。',
    build(root) {
      root.innerHTML = phoneBase(`<div class="tk-wrap" id="tkw">
        <div class="tk-bar live" id="tkb"><span class="tk-ico">🧠</span><span class="tk-label" id="tkl">正在思考</span><span class="tk-sec" id="tks"></span><span class="tk-chev">▶</span></div>
        <div class="tk-panel"><div class="tk-body" id="tkbody"></div></div>
      </div>
      <div class="msg bot" id="ans" style="display:none"><div class="bubble"></div></div>`)
      return root
    },
    wire(root, api) {
      const w = root.querySelector('#tkw'), b = root.querySelector('#tkb'), l = root.querySelector('#tkl'), sec = root.querySelector('#tks'), body = root.querySelector('#tkbody'), ans = root.querySelector('#ans')
      b.onclick = () => { w.classList.toggle('open'); api.vibrate() }
      api.onStart = (secEl) => { w.classList.remove('done','open'); b.classList.add('live'); l.textContent = '正在思考'; ans.style.display = 'none'; body.textContent = '' }
      api.onTick = (t, secN) => { body.textContent = t; body.scrollTop = body.scrollHeight; sec.textContent = secN + 's' }
      api.onDone = () => { b.classList.remove('live'); w.classList.add('done'); l.textContent = '思考完成 · 点按展开'; ans.style.display = ''; ans.querySelector('.bubble').innerHTML = ANSWER }
    }
  },
  B: {
    title: '浮点 + 底部抽屉',
    note: '<b>位置：</b>思考时右下角一颗脉冲浮点，消息流完全干净。<b>展开：</b>浮点 → 底部抽屉（可下拽关闭）。<b>优点：</b>零占位、交互最"原生"；<b>缺点：</b>与历史消息的对应关系弱。',
    build(root) {
      root.innerHTML = phoneBase(`<div class="msg bot" id="ans" style="display:none"><div class="bubble"></div></div>`,
        `<div class="tk-orb" id="orb" style="display:none"><span class="orb-dot"></span><span id="orbt">思考中</span></div>
         <div class="tk-sheet-overlay" id="ov"></div>
         <div class="tk-sheet" id="sh"><div class="grab"></div><div class="tk-sh-title">🧠 思考过程</div><div class="tk-sh-body" id="shb"></div></div>`)
      return root
    },
    wire(root, api) {
      const orb = root.querySelector('#orb'), orbt = root.querySelector('#orbt'), ov = root.querySelector('#ov'), sh = root.querySelector('#sh'), shb = root.querySelector('#shb'), ans = root.querySelector('#ans')
      const close = () => { ov.classList.remove('open'); sh.classList.remove('open') }
      orb.onclick = () => { ov.classList.add('open'); sh.classList.add('open'); api.vibrate() }
      ov.onclick = close
      api.onStart = () => { orb.style.display = 'flex'; orb.classList.remove('done'); orbt.textContent = '思考中'; shb.textContent = ''; ans.style.display = 'none'; close() }
      api.onTick = (t, secN) => { orbt.textContent = '思考中 ' + secN + 's'; shb.textContent = t; shb.scrollTop = shb.scrollHeight }
      api.onDone = () => { orb.classList.add('done'); orbt.textContent = '思考过程 · 查看'; ans.style.display = ''; ans.querySelector('.bubble').innerHTML = ANSWER }
    }
  },
  C: {
    title: '气泡窥视',
    note: '<b>位置：</b>答案气泡上方一条窥视带，实时滚动思考的最后一行。<b>展开：</b>原地展开全文。<b>优点：</b>思考和答案绑定最紧、最有"它在干活"的活感；<b>缺点：</b>视觉元素最多。',
    build(root) {
      root.innerHTML = phoneBase(`<div class="peek" id="pk" style="display:none">
        <div class="peek-line"><span class="tk-ico">🧠</span><span class="peek-text" id="pkt"></span><span class="peek-dots" id="pkd">●●●</span></div>
        <div class="peek-body"><div class="inner" id="pkb"></div></div>
      </div>
      <div class="msg bot" id="ans" style="display:none"><div class="bubble"></div></div>`)
      return root
    },
    wire(root, api) {
      const pk = root.querySelector('#pk'), pkt = root.querySelector('#pkt'), pkd = root.querySelector('#pkd'), pkb = root.querySelector('#pkb'), ans = root.querySelector('#ans')
      pk.querySelector('.peek-line').onclick = () => { pk.classList.toggle('open'); api.vibrate() }
      api.onStart = () => { pk.style.display = ''; pk.classList.remove('done','open'); pkd.style.display = ''; pkt.textContent = '正在思考…'; pkb.textContent = ''; ans.style.display = 'none' }
      api.onTick = (t, secN) => { const lines = t.split('\n').filter(Boolean); pkt.textContent = lines[lines.length - 1] || '正在思考…'; pkb.textContent = t; pkb.scrollTop = pkb.scrollHeight }
      api.onDone = () => { pk.classList.add('done'); pkd.style.display = 'none'; pkt.textContent = '思考完成 · 点按查看'; ans.style.display = ''; ans.querySelector('.bubble').innerHTML = ANSWER }
    }
  },
}

const stage = document.getElementById('stage')
for (const key of ['A', 'B', 'C']) {
  const o = OPTIONS[key]
  const wrap = document.createElement('div')
  wrap.className = 'option' + (key === 'A' ? ' on' : '')
  wrap.dataset.o = key
  const head = document.createElement('div')
  head.className = 'option-head'
  head.innerHTML = `<span class="tag">${key}</span><h2>${o.title}</h2>`
  const note = document.createElement('div')
  note.className = 'option-note'
  note.innerHTML = o.note
  const phone = document.createElement('div')
  phone.className = 'phone'
  o.build(phone)
  wrap.append(head, phone, note)
  stage.appendChild(wrap)

  // 行为：模拟思考流
  const api = { vibrate: () => { try { navigator.vibrate && navigator.vibrate(8) } catch (e) {} } }
  o.wire(phone, api)
  let timer = null
  const replay = () => {
    clearInterval(timer)
    api.onStart && api.onStart()
    const chars = SAMPLE_REASONING.split('')
    let i = 0, shown = ''
    const t0 = Date.now()
    timer = setInterval(() => {
      shown += chars.slice(i, i + 6).join(''); i += 6
      api.onTick && api.onTick(shown, Math.round((Date.now() - t0) / 1000))
      if (i >= chars.length) { clearInterval(timer); setTimeout(() => api.onDone && api.onDone(), 350) }
    }, 60)
  }
  phone.querySelector('.replay').onclick = replay
  replay()
}
document.getElementById('switcher').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return
  document.querySelectorAll('.switcher button').forEach((x) => x.classList.toggle('on', x === b))
  document.querySelectorAll('.option').forEach((x) => x.classList.toggle('on', x.dataset.o === b.dataset.o))
})
</script>
</body>
</html>
