<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>思考过程 · 方案 D（气泡侧挂图标 + 底部抽屉）</title>
<style>
  :root {
    --bg:#0b0e14; --bg-elev:#12161f; --bg-card:#171c28; --bg-card-2:#1d2331;
    --line:rgba(255,255,255,.08); --text:#e8ebf1; --text-2:#9aa3b2; --text-3:#7d8590;
    --accent:#3b82f6; --purple:#bf5af2; --purple-soft:rgba(191,90,242,.14);
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
    --ease-out:cubic-bezier(0.23,1,0.32,1); --ease-drawer:cubic-bezier(0.32,0.72,0,1);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); color:var(--text); font-family:var(--font); height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden; }

  .p-nav { flex:none; padding:14px 14px 10px; border-bottom:.5px solid var(--line); font-size:15px; font-weight:600; display:flex; align-items:center; gap:8px; }
  .p-nav .sub { font-size:11px; color:var(--text-3); font-weight:400; }
  .p-chat { flex:1; overflow-y:auto; padding:14px 12px; display:flex; flex-direction:column; gap:14px; overscroll-behavior:contain; }

  /* 气泡行：气泡 + 右侧思考图标 */
  .msg { max-width:100%; display:flex; flex-direction:column; gap:5px; }
  .msg.user { align-items:flex-end; }
  .msg.user .bubble { background:var(--accent); color:#fff; border-bottom-right-radius:6px; max-width:85%; }
  .msg.bot .brow { display:flex; align-items:flex-end; gap:7px; }
  .msg.bot .bubble { background:var(--bg-card); border:.5px solid var(--line); border-bottom-left-radius:6px; max-width:calc(85% - 32px); }
  .bubble { padding:10px 14px; border-radius:19px; font-size:14.5px; line-height:1.55; word-break:break-word; }

  /* 思考图标：附着在气泡右侧的小圆钮 */
  .tk-dot {
    width:26px; height:26px; border-radius:50%; flex:none; margin-bottom:2px;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line); background:var(--bg-card); color:var(--text-3);
    cursor:pointer; transition:transform .16s var(--ease-out), border-color .2s ease, color .2s ease;
  }
  .tk-dot:active { transform:scale(.88); }
  .tk-dot svg { width:14px; height:14px; }
  /* 思考中：紫色呼吸 + 细环旋转 */
  .tk-dot.live { color:var(--purple); border-color:rgba(191,90,242,.45); background:var(--purple-soft); animation:tk-breathe 1.6s ease-in-out infinite; }
  @keyframes tk-breathe { 0%,100% { box-shadow:0 0 0 0 rgba(191,90,242,.35); } 50% { box-shadow:0 0 0 6px rgba(191,90,242,0); } }

  .m-meta { font-size:11px; color:var(--text-3); padding:0 6px; }

  .replay-bar { flex:none; padding:10px 12px 14px; display:flex; gap:8px; }
  .replay { flex:1; padding:12px 0; border:none; border-radius:13px; background:var(--bg-card-2); color:var(--text-2); font-size:13.5px; font-weight:600; }
  .replay:active { transform:scale(.97); }

  /* 底部抽屉 */
  .ov { position:fixed; inset:0; background:rgba(0,0,0,.45); opacity:0; pointer-events:none; transition:opacity .22s ease; z-index:40; }
  .ov.open { opacity:1; pointer-events:auto; }
  .drawer {
    position:fixed; left:0; right:0; bottom:0; z-index:41; max-height:76vh;
    background:var(--bg-elev); border-radius:18px 18px 0 0; border-top:.5px solid var(--line);
    transform:translateY(103%); transition:transform .3s var(--ease-drawer);
    display:flex; flex-direction:column;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .drawer.open { transform:none; }
  .drawer .grab { width:36px; height:5px; border-radius:3px; background:var(--text-3); opacity:.55; margin:8px auto 2px; flex:none; }
  .drawer .d-head { display:flex; align-items:center; gap:8px; padding:4px 16px 10px; flex:none; }
  .drawer .d-title { font-size:13px; font-weight:700; color:var(--text-2); }
  .drawer .d-live { font-size:11px; font-weight:600; color:var(--purple); background:var(--purple-soft); border-radius:10px; padding:2px 8px; display:none; align-items:center; gap:5px; }
  .drawer .d-live.on { display:inline-flex; }
  .drawer .d-live .dot { width:6px; height:6px; border-radius:50%; background:var(--purple); animation:tk-breathe 1.2s infinite; }
  .drawer .d-close { margin-left:auto; width:30px; height:30px; border-radius:50%; border:none; background:var(--bg-card-2); color:var(--text-2); font-size:14px; }
  .drawer .d-body { overflow-y:auto; padding:0 16px 20px; font-size:12.5px; line-height:1.75; color:var(--text-2); font-family:var(--mono); white-space:pre-wrap; word-break:break-word; }
  .drawer .d-body .done-mark { color:var(--text-3); }
</style>
<style>
  /* 图标选择器 */
  .icon-pick { flex:none; display:flex; align-items:center; gap:8px; padding:10px 14px 6px; font-size:12.5px; color:var(--text-3); }
  .icon-pick button { padding:7px 14px; border-radius:16px; border:1px solid var(--line); background:var(--bg-card); color:var(--text-2); font-size:12.5px; }
  .icon-pick button.on { border-color:var(--purple); color:var(--purple); background:var(--purple-soft); }
  /* 候选 1 星芒：活体=紫色旋转+呼吸；安静=灰描边 */
  .tk-dot.st-spark.live svg { animation:sp-rotate 2.2s linear infinite; }
  @keyframes sp-rotate { to { transform:rotate(360deg); } }
  /* 候选 2 打字泡：活体=三点波浪 */
  .tk-dot.st-type.live .td { animation:ty-wave 1.1s ease-in-out infinite; }
  .tk-dot.st-type.live .td:nth-child(2) { animation-delay:.15s }
  .tk-dot.st-type.live .td:nth-child(3) { animation-delay:.3s }
  @keyframes ty-wave { 0%,100% { transform:translateY(0); opacity:.5 } 50% { transform:translateY(-2.4px); opacity:1 } }
  /* 候选 3 彗星/漩涡：活体=弧线旋转 */
  .tk-dot.st-swirl.live svg { animation:sp-rotate 1.5s linear infinite; }
</style>
</head>
<body>

<div class="p-nav">修复登录重定向循环 <span class="sub">方案 D · 图标候选（先点上方挑一个，再点气泡旁的小圆钮）</span></div>
<div class="icon-pick" id="iconpick">
  <span>图标风格：</span>
  <button data-s="spark" class="on">① 星芒</button>
  <button data-s="type">② 打字泡</button>
  <button data-s="swirl">③ 彗星</button>
</div>
<div class="p-chat" id="chat"></div>
<div class="replay-bar">
  <button class="replay" id="replay">▶ 重放（先思考，再回答）</button>
</div>

<div class="ov" id="ov"></div>
<div class="drawer" id="drawer">
  <div class="grab"></div>
  <div class="d-head">
    <span class="d-title" id="dtitle">思考过程</span>
    <span class="d-live" id="dlive"><span class="dot"></span>正在思考</span>
    <button class="d-close" id="dclose">✕</button>
  </div>
  <div class="d-body" id="dbody"></div>
</div>

<script>
const GLYPHS = {
  /* 星芒：四芒星 */
  spark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path class="star" d="M12 3c.7 4.6 4.3 8.3 9 9-4.7.7-8.3 4.3-9 9-.7-4.7-4.3-8.3-9-9 4.7-.7 8.3-4.3 9-9z"/></svg>',
  /* 打字泡：气泡里三颗点 */
  type: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.6 0-3.1-.4-4.3-1.1L3 20l1.2-5.2A8.5 8.5 0 1 1 21 11.5z"/><circle class="td" cx="8.6" cy="11.5" r="1.15" fill="currentColor" stroke="none"/><circle class="td" cx="12.4" cy="11.5" r="1.15" fill="currentColor" stroke="none"/><circle class="td" cx="16.2" cy="11.5" r="1.15" fill="currentColor" stroke="none"/></svg>',
  /* 彗星：圆心 + 带箭头的旋转弧 */
  swirl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 5.5A6.5 6.5 0 0 1 18.5 12"/><path d="M18.5 12l1.9-1.1M18.5 12l1.1 1.9"/></svg>',
}
let glyph = 'spark'

const R1 = `先看登录态校验的中间件：它比对的是精确字符串。
把回调地址打出来……果然，末尾多了一个 /。
而平台后台注册的回调不带 /。严格相等 → 不匹配 → 打回登录页 → 又带票跳回 → 循环。
修复：拼接处去掉末尾斜杠；中间件侧加一条 mismatch 日志。`
const A1 = '问题定位了：回调地址末尾的 `/` 导致鉴权后被误判未登录。已修复并加了日志，你再试一下。'
const R2 = `用户又报了一次，这次带截图。
看截图里的地址栏：重定向链是 /login → /callback → /login。
说明上次只修了拼接，服务端的 session 写入没生效。
查 Set-Cookie 的 SameSite……是 Strict，跨站回调回来时 cookie 没带。
改成 Lax，并给回调路径加一次性豁免。`
const A2 = '还有一个问题：回调是跨站跳转，`SameSite=Strict` 把会话 cookie 拦了。已改成 `Lax`，这次应该真的好了。'

const chat = document.getElementById('chat')
const ov = document.getElementById('ov'), drawer = document.getElementById('drawer')
const dbody = document.getElementById('dbody'), dlive = document.getElementById('dlive')
let liveTimer = null, liveDot = null

function vib() { try { navigator.vibrate && navigator.vibrate(8) } catch (e) {} }
function openDrawer(text, live) {
  dbody.textContent = text
  dlive.classList.toggle('on', !!live)
  ov.classList.add('open'); drawer.classList.add('open')
  dbody.scrollTop = dbody.scrollHeight
}
function closeDrawer() { ov.classList.remove('open'); drawer.classList.remove('open') }
ov.onclick = closeDrawer
document.getElementById('dclose').onclick = closeDrawer
// 下拽关闭
;(function () {
  let sy = null, dy = 0
  drawer.addEventListener('touchstart', (e) => { sy = e.touches[0].clientY; dy = 0 }, { passive: true })
  drawer.addEventListener('touchmove', (e) => {
    dy = Math.max(0, e.touches[0].clientY - sy)
    if (dbody.scrollTop > 0) return
    if (dy > 0) { drawer.style.transform = 'translateY(' + dy + 'px)'; drawer.style.transition = 'none'; e.preventDefault() }
  }, { passive: false })
  drawer.addEventListener('touchend', () => {
    drawer.style.transition = ''; drawer.style.transform = ''
    if (dy > 100) closeDrawer()
  })
})()

function dotEl(live) {
  const d = document.createElement('span')
  d.className = 'tk-dot st-' + glyph + (live ? ' live' : '')
  d.innerHTML = GLYPHS[glyph]
  return d
}
/* 图标风格切换：重渲染所有圆钮 */
document.getElementById('iconpick').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return
  glyph = b.dataset.s
  document.querySelectorAll('#iconpick button').forEach((x) => x.classList.toggle('on', x === b))
  document.querySelectorAll('.tk-dot').forEach((d) => {
    d.className = 'tk-dot st-' + glyph + (d.classList.contains('live') ? ' live' : '')
    d.innerHTML = GLYPHS[glyph]
  })
})
function userMsg(t) {
  const m = document.createElement('div'); m.className = 'msg user'
  const b = document.createElement('div'); b.className = 'bubble'; b.textContent = t
  m.appendChild(b); return m
}
function botMsg(html, reasoning, time) {
  const m = document.createElement('div'); m.className = 'msg bot'
  const row = document.createElement('div'); row.className = 'brow'
  const b = document.createElement('div'); b.className = 'bubble'; b.innerHTML = html
  const dot = dotEl(false)
  dot.onclick = () => { vib(); openDrawer(reasoning, false) }
  row.append(b, dot)
  const meta = document.createElement('div'); meta.className = 'm-meta'; meta.textContent = time
  m.append(row, meta)
  return m
}

function renderStatic() {
  chat.innerHTML = ''
  chat.appendChild(userMsg('登录成功后又被踢回登录页，查一下'))
  chat.appendChild(botMsg(A1, R1, '13:02'))
  chat.appendChild(userMsg('还是不行，我截了图（图略）'))
  chat.appendChild(botMsg(A2, R2, '13:07'))
}
renderStatic()

/* 重放：第三条回答先思考（活点）再出答案 */
document.getElementById('replay').onclick = () => {
  clearInterval(liveTimer)
  renderStatic()
  chat.appendChild(userMsg('推到生产环境吧'))
  // 思考中的气泡：内容区是空的，只有右侧活体图标
  const m = document.createElement('div'); m.className = 'msg bot'
  const row = document.createElement('div'); row.className = 'brow'
  const b = document.createElement('div'); b.className = 'bubble'
  const dot = dotEl(true)
  row.append(b, dot); m.appendChild(row)
  chat.appendChild(m)
  chat.scrollTop = chat.scrollHeight
  const R3 = `要先确认当前分支和远程是否一致。
git status …干净；git log origin/main..HEAD → 3 个提交。
推之前跑一遍构建？这个项目没有 CI，本地 build 一下保险。
build 过了。推送。`
  let i = 0, shown = ''
  const openLive = () => { openDrawer(shown, true) }
  dot.onclick = () => { vib(); openLive() }
  liveTimer = setInterval(() => {
    shown += R3.split('').slice(i, i + 5).join(''); i += 5
    if (drawer.classList.contains('open') && dlive.classList.contains('on')) { dbody.textContent = shown; dbody.scrollTop = dbody.scrollHeight }
    if (i >= R3.length) {
      clearInterval(liveTimer)
      setTimeout(() => {
        b.innerHTML = '构建通过，3 个提交已推到 main，线上 1 分钟后生效。'
        dot.classList.remove('live')
        dot.onclick = () => { vib(); openDrawer(R3, false) }
        if (drawer.classList.contains('open')) dlive.classList.remove('on')
        const meta = document.createElement('div'); meta.className = 'm-meta'; meta.textContent = '刚刚'
        m.appendChild(meta)
      }, 400)
    }
  }, 55)
}
document.getElementById('replay').click()
</script>
</body>
</html>
