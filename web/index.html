<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0e14">
<link rel="manifest" href="/m/manifest.webmanifest">
<link rel="icon" href="/m/icon.svg" type="image/svg+xml">
<!-- iOS 主屏幕图标不支持 SVG，必须 PNG -->
<link rel="apple-touch-icon" href="/m/icon-180.png">
<link rel="stylesheet" href="/m/style.css?v=1.6.5">
<script>
/* 主题预置：首帧前落地，避免浅色用户冷启动闪黑 */
(function(){try{var t=localStorage.getItem('dsh-mobile-theme');if(!t&&typeof matchMedia!=='undefined')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';if(t==='light')document.documentElement.classList.add('light')}catch(e){}})();
</script>
<title>DSH Mobile</title>
</head>
<body>
<div id="app"><div class="splash"><div class="logo"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg></div><div>DSH Mobile 加载中…</div></div></div>
<script src="/m/app.js?v=1.6.5"></script>
</body>
</html>
